plugins {
    alias(libs.plugins.spring.boot) apply false
    alias(libs.plugins.spring.dependency.management) apply false
}

// check (and so build) of the root project fails when docs/documentation.html is out of date
apply plugin: 'base'
apply from: 'gradle/documentation.gradle'

allprojects {
    group = 'com.bbh.itss.dso'
    version = findProperty('artifactVersion') ?: '0.1.0-SNAPSHOT'
}

def performanceFactor = providers.systemProperty('performance.factor')
        .orElse(providers.gradleProperty('performance.factor'))
        .getOrElse('2.0')

subprojects {
    apply plugin: 'base'

    plugins.withType(JavaBasePlugin).configureEach {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
        }
        tasks.withType(JavaCompile).configureEach {
            options.compilerArgs << '-parameters'
        }
    }

    // check (and so build) runs the smoke, regression and performance suites too, not only the unit tests
    pluginManager.withPlugin('jvm-test-suite') {
        tasks.named('check') {
            dependsOn project.testing.suites.matching { it.name != 'test' }
        }
    }

    ext.performanceFactor = performanceFactor
    ext.forward = { Test task, String... names ->
        names.each { name ->
            def value = providers.systemProperty(name).orNull
            if (value != null) {
                task.systemProperty name, value
            }
        }
    }
}

