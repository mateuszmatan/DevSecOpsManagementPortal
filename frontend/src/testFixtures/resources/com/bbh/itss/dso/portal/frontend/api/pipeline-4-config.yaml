pipeline:
  type: full
  entryPoint: devSecOpsPipeline
  product: PAYHUB
  projectNames: gateway
  agentNames:
  - linux-agent
platform:
  jenkinsUrl: https://jenkins.bbh.com
  jenkinsLibrary: DevSecOpsJenkinsLibrary
  environment:
    APPSCAN_SERVER_URL: https://bbh.cloud.appscan.com
    APPSCAN_HOST: bbh.cloud.appscan.com
    SA_LINUX_URL: https://tools.bbh.com/nexus/repository/releases/com/bbh/appscan/SAClientUtil/8.0.1646_Linux/SAClientUtil-8.0.1646_Linux-SAClientUtil_8.0.1646_Linux.zip
    SA_WIN_URL: https://tools.bbh.com/nexus/repository/releases/com/bbh/appscan/SAClientUtil/8.0.1646_Win/SAClientUtil-8.0.1646_Win-SAClientUtil_8.0.1646_Win.zip
    PROXY_HOST: tstproxy.bbh.com
    PROXY_PORT: '9090'
    PROXY_USER: PROXY_ASOCJenk
  oisHost: oisapi.bbh.com
  nexusSnapshotRepositoryUrl: http://tools.bbh.com/nexus/content/repositories/snapshots/
  nexusSnapshotRepositoryId: bbh-snapshots
  iosBuildAgent: mac002.bbh.com
defaults:
  buildTool: gradle
  deployTarget: vm
  sourceDir: .
  coverage:
    minLine: 60
  tools:
    sonar:
      qualityGate:
        waitForQualityGate: true
        timeoutMinutes: 5
    nexusIq:
      maxCritical: 0
      maxHigh: 0
      maxMedium: 0
  sast:
    prepareTimeoutMin: 120
    pollTimeoutMin: 50
    pollIntervalSec: 30
    maxCritical: 0
    maxHigh: 0
    maxMedium: 0
  sca:
    enabled: true
    pollTimeoutMin: 40
    pollIntervalSec: 30
    maxCritical: 0
    maxHigh: 0
    maxMedium: 0
  dast:
    pollTimeoutMin: 60
    pollIntervalSec: 60
    reportTimeoutMin: 30
    reportIntervalSec: 30
    maxCritical: 0
    maxHigh: 0
    maxMedium: 0
  tests:
    maxParallel: 20
  releaseGate:
    scanners:
    - sast
    - sca
    - niq
    - dast
    requireCoverage: true
    stateFile: release-gate.json
  goldenFix:
    enabled: true
    onlyDirectDependencies: true
    minThreatLevel: 2
    ecosystems:
    - maven
    - npm
    - pypi
    goldenVersionTypes:
    - recommended-non-breaking-with-dependencies
    - recommended-non-breaking
    verify:
      enabled: true
      maxAttempts: 3
      timeoutMinutes: 20
    commitAuthorName: DevSecOps GoldenFix
    commitAuthorEmail: devsecops-goldenfix@noreply.local
projects:
  gateway:
    appId: 3a1b2c3d-1111-4a5b-8c9d-0e1f2a3b4c5d
    buildTool: maven
    deployTarget: openshift
    sourceDir: .
    javaPath: /usr/lib/jvm/java-17-openjdk
    excludedDirs: node_modules
    appName: payhub-gateway
    artifactName: payhub-gateway.jar
    asoc:
      url: https://bbh.cloud.appscan.com
      keyId: bbh_1c2d3e4f-0000-4abc-9def-123456789abc
    influx:
      url: http://qcwsecopsmon1.testbbh.com:8086/api/v2/write?org=DevSecOps&bucket=DORA-metrics&precision=s
      credentialsId: influxdb-token
      enabled: true
      project: PAYHUB-gateway
      env: test
    tools:
      sonar:
        serverUrl: https://tools.bbh.com/sonar
        installationName: SonarQube
        projectName: PAYHUB-GATEWAY
        projectKey: payhub-gateway
        maven:
          goals:
          - sonar:sonar
      nexusIq:
        serverUrl: https://tools.bbh.com/IQ
        credentialsId: nexusiqP
        application: payhub-gateway
        scanPatterns:
        - '**/target/*.jar'
        stage: build
        failOnNetworkError: false
    sast:
      scanName: payhub-gateway-sast
    dast:
      enabled: true
      scanName: payhub-gateway-dast
      targetUrl: http://rdltaapps1.testbbh.com
    build:
      buildPath: target/*.jar
      maven:
        goals:
        - clean
        - verify
        flags:
        - -B
        - -U
        env:
          MAVEN_OPTS: -Xms512m -Xmx1g
    scm:
      bitbucket:
        url: https://bitbucket.bbh.com/projects/PAY/repos/payhub-gateway
        credentialsId: bitbucket-http-credentials
        authType: basic
    tests:
      unitTests:
        maven:
          goals:
          - test
          - jacoco:report
        unitTestResult: target/surefire-reports/*.xml
      smoke:
        jobs:
        - name: PAYHUB-GATEWAY - smoke
          type: local
          job: payhub-gateway/smoke-tests
          timeoutMin: 15
        - name: PAYHUB-GATEWAY - login smoke
          url: https://jenkins-a.bbh.com/job/smoke/job/payhub-gateway-login
          credentialsId: remote-jenkins-api-token
      regression:
        jobs:
        - name: PAYHUB-GATEWAY - regression
          type: local
          job: payhub-gateway/regression-tests
          timeoutMin: 60
          parameters: ENV=rd
      performance:
        jobs:
        - name: PAYHUB-GATEWAY - performance
          type: local
          job: payhub-gateway/performance-tests
          timeoutMin: 120
    deploy:
      openshift:
        rd:
          projectBuildR: pay-payhub-build
          buildConfigPath: openshift/buildconfig.yaml
          dockerFilePath: openshift/Dockerfile
          buildContext: target/docker
          qcDockerRepoPush: docker-qc.tools.bbh.com/pay-payhub/gateway
          qcDockerRepoPull: docker-qc.tools.bbh.com/pay-payhub/gateway
          openshiftCertDir: /etc/pki/openshift
          nexus:
            authfile: /home/jenkins/.docker/nexus-auth.json
          projectDeploymentR: pay-payhub-rd
          deployConfigPath: openshift/deployment.yaml
          configPathR: openshift/config-rd.yaml
          healthCheckUrl: /actuator/health
          routeHostnameR: payhub-gateway-rd.apps.ocp-rd.testbbh.com
        qc:
          qcDockerRepoPull: docker-qc.tools.bbh.com/pay-payhub/gateway
          projectDeploymentR: pay-payhub-qc
          deployConfigPath: openshift/deployment.yaml
          configPathR: openshift/config-qc.yaml
          healthCheckUrl: /actuator/health
          routeHostnameR: payhub-gateway-qc.apps.ocp-qc.testbbh.com
