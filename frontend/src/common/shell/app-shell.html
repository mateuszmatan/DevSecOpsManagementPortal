<div class="shell">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" routerLink="/">
        <span class="brand-name"><strong>BBH</strong> {{ name }}</span>
      </a>
      <nav class="menu" aria-label="Main">
        @for (section of sections(); track section.path) {
          <a
            class="menu-link"
            [routerLink]="section.path"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            >{{ section.label }}</a
          >
        }
      </nav>
      @if (user(); as user) {
        <div class="user-badge" [title]="user.email ?? user.displayName">
          <span class="user-name">{{ user.displayName }}</span>
          @if (user.admin) {
            <span class="badge user-role">Admin</span>
          }
        </div>
      }
    </div>
  </header>

  <main class="content">
    <router-outlet />
  </main>

  <footer class="footer">
    <span>BBH 2026</span>
  </footer>
</div>
