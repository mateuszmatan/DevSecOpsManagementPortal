<div class="shell">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" routerLink="/">
        <span class="brand-name"><strong>BBH</strong> {{ name }}</span>
      </a>
      <nav class="menu" aria-label="Main">
        @for (section of sections(); track section.path) {
          <a
            class="menu-link"
            [routerLink]="section.path"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            >{{ section.label }}</a
          >
        }
      </nav>
      <div class="user-badge" title="User: Mateusz Matan | Roles: Admin, Departments: AI Lab, Capital Partners, Corporate Technology, Custody, Fund Services">
        <span class="user-icon" aria-hidden="true">👤</span>
        <span class="user-name">Mateusz Matan</span>
        <span class="badge user-role">Admin</span>
      </div>
    </div>
  </header>

  <main class="content">
    <router-outlet />
  </main>

  <footer class="footer">
    <span>BBH 2026</span>
  </footer>
</div>
